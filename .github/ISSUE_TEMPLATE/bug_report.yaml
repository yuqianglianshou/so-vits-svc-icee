name: Bug 报告
description: 报告可以稳定复现的程序错误
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请阅读 README、已知限制和常见问题。请删除日志中的用户名、令牌和私人文件路径等敏感信息。
  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交前确认
      options:
        - label: 我已阅读 README、已知限制和 Windows 常见问题排查。
          required: true
        - label: 我使用的是当前仓库代码，并确认问题可以重复出现。
          required: true
  - type: input
    id: revision
    attributes:
      label: 项目版本或 commit
      description: 可运行 `git rev-parse --short HEAD` 获取。
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 操作系统
      placeholder: Windows 11 23H2 64 位
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU 与显存
      placeholder: NVIDIA RTX 3060 12 GB
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Python、PyTorch 与 CUDA
      placeholder: Python 3.11.9 / PyTorch 2.x / CUDA 12.x
    validations:
      required: true
  - type: dropdown
    id: entrypoint
    attributes:
      label: 出现问题的入口
      options:
        - 训练页面
        - 推理页面
        - TensorBoard
        - 命令行工具
        - 安装或启动脚本
    validations:
      required: true
  - type: textarea
    id: workspace
    attributes:
      label: 模型工作区状态
      description: 说明模型名、执行到第几步、依赖状态和使用的 checkpoint；不要上传模型权重。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 从启动命令开始，按顺序列出每一步操作。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 完整日志
      description: 从任务启动到失败的完整日志。请先移除敏感信息。
      render: shell
    validations:
      required: true
  - type: dropdown
    id: reproducibility
    attributes:
      label: 复现稳定性
      options:
        - 每次都能复现
        - 偶尔复现
        - 只发生过一次
    validations:
      required: true
