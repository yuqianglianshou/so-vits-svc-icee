name: 安装与使用帮助
description: 安装、依赖、训练或推理流程无法继续
title: "[Help] "
labels: ["help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        请先阅读快速开始、环境与兼容性、模型依赖清单和常见问题。描述你卡住的具体步骤，避免只写“不能用”。
  - type: checkboxes
    id: read_docs
    attributes:
      label: 文档确认
      options:
        - label: 我已阅读与当前步骤对应的文档和常见问题。
          required: true
        - label: 我会删除日志中的令牌、用户名和私人路径等敏感信息。
          required: true
  - type: input
    id: revision
    attributes:
      label: 项目版本或 commit
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 操作系统、GPU 与显存
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Python、PyTorch 与 CUDA
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: 当前步骤
      options:
        - 安装依赖
        - 启动训练页
        - 准备模型依赖
        - 导入数据
        - 重采样
        - 生成配置与列表
        - 提取特征
        - 主模型训练
        - 扩散或索引训练
        - 启动推理页
        - 加载模型或转换音频
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: 页面或终端提示
      description: 原样填写错误信息，并说明任务日志文件的位置。
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: 已经尝试的处理
      description: 列出执行过的命令和结果，避免其他人重复建议。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 完整日志
      render: shell
    validations:
      required: true
