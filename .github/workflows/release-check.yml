name: Release check

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install check dependencies
        run: python -m pip install -r requirements-dev.txt PyYAML
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Run lightweight smoke checks
        run: |
          python scripts/verify_app_smoke.py
          python scripts/verify_stability_fixes.py
      - name: Test release checks
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest tests/test_release_checks.py -q
      - name: Validate release contents
        run: python scripts/check_release.py
